name: Teste de API e Health Check

# Roda em todo push ou pode ser acionado manualmente
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código do repositório
      - name: Checkout do código
        uses: actions/checkout@v4

      # 2. Configura o Python
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 

      # 3. Instala as dependências (certifique-se de ter um requirements.txt)
      - name: Instalar dependências necessárias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. Roda o main.py em Background (&)
      # Usamos 'nohup' para garantir que o processo não morra e '&' para liberar o terminal
      - name: Iniciar API (main.py)
        run: |
          nohup python main.py > api.log 2>&1 &
          echo "API iniciada em background. Aguardando 10 segundos..."
          sleep 10

      # 5. Verifica se o processo ainda está rodando (Opcional, mas útil para debug)
      - name: Verificar se API está ativa
        run: |
          cat api.log
          ps aux | grep python

      # 6. Faz o Request GET para testar
      # O curl -f faz o step falhar se o status code não for 2xx
      # O curl -v mostra os detalhes no log
      - name: Testar Endpoint (Get Livros)
        run: |
          curl -v -f http://localhost:5002/api/livros

      # 7. Valida o conteúdo do JSON (Array e Propriedades)
      - name: Validar Conteúdo do JSON
        run: |
          # O curl -s (silent) é importante para não sujar o output com barra de progresso
          curl -s -f http://localhost:5002/api/livros | python3 -c "
          import sys, json
          
          try:
              # Lê o JSON que veio do curl
              data = json.load(sys.stdin)
              
              # 1. Testa se é uma lista (Array)
              if not isinstance(data, list):
                  print('❌ Erro: O retorno não é um Array.')
                  sys.exit(1)
              
              # (Opcional) Testa se o array não está vazio
              if len(data) == 0:
                  print('⚠️ Aviso: O array está vazio, não há itens para testar.')
                  sys.exit(0)

              # 2. Pega o primeiro item
              primeiro_item = data[0]
              
              # 3. Testa as propriedades obrigatórias
              chaves_obrigatorias = ['id', 'titulo', 'descricao']
              erro = False
              
              for chave in chaves_obrigatorias:
                  if chave not in primeiro_item:
                      print(f'❌ Erro: A propriedade \'{chave}\' não foi encontrada no primeiro item.')
                      erro = True
              
              if erro:
                  sys.exit(1)
                  
              print('✅ Sucesso: O JSON é um array válido e contém as chaves esperadas.')
              
          except json.JSONDecodeError:
              print('❌ Erro: A resposta não é um JSON válido.')
              sys.exit(1)
          except Exception as e:
              print(f'❌ Erro inesperado: {e}')
              sys.exit(1)
          "

      # 8. Testes de Regra de Negócio (Busca via POST com e sem resultados)
      - name: Validar Cenários de Busca (Python vs Cobol)
        run: |
          python3 -c "
          import sys, json, urllib.request, urllib.error

          BASE_URL = 'http://localhost:5002/api/livros/buscar'

          def testar_cenario(termo_busca, deve_encontrar_itens):
              print(f'🔍 [Cenário POST] Buscando por: \'{termo_busca}\'...')

              # 1. PREPARA O CORPO (JSON)
              payload = {'titulo': termo_busca}
              data_bytes = json.dumps(payload).encode('utf-8') # Converte p/ bytes

              # 2. MONTA A REQUISIÇÃO
              # O parâmetro 'data' força o urllib a usar POST automaticamente, 
              # mas deixamos method='POST' explicito para garantir.
              req = urllib.request.Request(BASE_URL, data=data_bytes, method='POST')
              req.add_header('Content-Type', 'application/json') # Essencial!

              try:
                  # Envia o request
                  with urllib.request.urlopen(req) as response:
                      status_code = response.getcode()
                      conteudo = json.loads(response.read().decode())

                      # --- REGRA 1: Status deve ser SEMPRE 200 (mesmo vazio) ---
                      if status_code != 200:
                          print(f'❌ Falha: Status Code retornado foi {status_code}. Esperado: 200.')
                          sys.exit(1)

                      # --- REGRA 2: O retorno deve ser sempre uma Lista ---
                      if not isinstance(conteudo, list):
                          print('❌ Falha: O retorno da API não é um Array/Lista.')
                          sys.exit(1)

                      # --- REGRA 3: Validação específica do cenário ---
                      qtd_itens = len(conteudo)
                      
                      if deve_encontrar_itens:
                          # Cenário 1: Python (Esperamos itens)
                          if qtd_itens > 0:
                              titulo_primeiro = conteudo[0].get('titulo', '')
                              print(f'✅ Sucesso: Encontrou {qtd_itens} livro(s). Primeiro: {titulo_primeiro}')
                          else:
                              print(f'❌ Falha: Esperava encontrar livros com \'{termo_busca}\', mas a lista veio vazia.')
                              sys.exit(1)
                      else:
                          # Cenário 2: Cobol (Esperamos lista vazia, mas STATUS 200)
                          if qtd_itens == 0:
                              print('✅ Sucesso: Lista vazia retornada corretamente com Status 200.')
                          else:
                              print(f'❌ Falha: Esperava lista vazia para \'{termo_busca}\', mas vieram {qtd_itens} itens.')
                              sys.exit(1)

              except urllib.error.HTTPError as e:
                  print(f'❌ Erro HTTP Fatal: {e.code} - {e.reason}. (Verifique se sua rota aceita POST)')
                  sys.exit(1)
              except Exception as e:
                  print(f'❌ Erro Inesperado: {e}')
                  sys.exit(1)
              
              print('---')

          # --- EXECUÇÃO DOS CENÁRIOS ---
          
          # 1. Busca que DEVE ter sucesso (Python)
          testar_cenario('Python', deve_encontrar_itens=True)

          # 2. Busca que NÃO DEVE ter itens, mas DEVE ser 200 OK (Cobol)
          testar_cenario('Cobol', deve_encontrar_itens=False)
          "

      # 9. Testes de GET por ID (Sucesso, 404 e Validação de Tipo)
      - name: Validar Busca de Livro por ID
        run: |
          python3 -c "
          import sys, json, urllib.request, urllib.error

          # --- CONFIGURAÇÃO ---
          BASE_URL = 'http://localhost:5002/api/livros'
          ID_EXISTENTE = 6
          TITULO_ESPERADO = 'Python'
          ID_INEXISTENTE = 999
          ID_INVALIDO = 'abc'

          def validar_get_id(id_teste, cenario):
              url = f'{BASE_URL}/{id_teste}'
              print(f'🔍 [{cenario}] GET em: {url}')

              try:
                  with urllib.request.urlopen(url) as response:
                      status = response.getcode()
                      body = json.loads(response.read().decode())
                      
                      # --- CENÁRIO 1: HAPPY PATH (Sucesso) ---
                      if cenario == 'SUCESSO':
                          if status != 200:
                              print(f'❌ Falha: Esperava 200, recebeu {status}')
                              sys.exit(1)
                          
                          # Valida dados do JSON
                          if body.get('id') != ID_EXISTENTE:
                              print(f'❌ Falha: ID retornado ({body.get("id")}) diferente do pedido ({ID_EXISTENTE})')
                              sys.exit(1)
                          
                          if body.get('titulo') != TITULO_ESPERADO:
                              print(f'❌ Falha: Título incorreto. Veio: {body.get("titulo")}')
                              sys.exit(1)
                              
                          print(f'✅ Sucesso: Livro {ID_EXISTENTE} retornado corretamente.')
                          return

                      # Se cair aqui num cenário de ERRO (ex: esperava 404 mas veio 200), falha
                      if cenario in ['NAO_ENCONTRADO', 'ID_INVALIDO']:
                          print(f'❌ Falha: Esperava erro (404/400), mas a API retornou 200 OK para ID {id_teste}.')
                          sys.exit(1)

              except urllib.error.HTTPError as e:
                  body_erro = e.read().decode()
                  
                  # --- CENÁRIO 2: NÃO ENCONTRADO (404) ---
                  if cenario == 'NAO_ENCONTRADO':
                      if e.code == 404:
                          # Opcional: Validar mensagem de erro no body
                          print(f'✅ Sucesso: Recebeu 404 corretamente para ID {id_teste}.')
                      else:
                          print(f'❌ Falha: Esperava 404, recebeu {e.code}.')
                          sys.exit(1)

                  # --- CENÁRIO 3: ID INVÁLIDO (400 ou 404) ---
                  elif cenario == 'ID_INVALIDO':
                      if e.code in [400, 404]: # Aceita ambos conforme sua regra
                          print(f'✅ Sucesso: Recebeu status de erro {e.code} para ID inválido.')
                      else:
                          print(f'❌ Falha: Status inesperado para ID texto: {e.code}.')
                          sys.exit(1)
                  
                  # Se der erro no cenário de SUCESSO
                  elif cenario == 'SUCESSO':
                      print(f'❌ Falha: Esperava 200, mas deu erro {e.code}.')
                      sys.exit(1)

              except Exception as e:
                  print(f'❌ Erro Inesperado: {e}')
                  sys.exit(1)
              
              print('---')

          # --- EXECUÇÃO ---
          validar_get_id(ID_EXISTENTE, 'SUCESSO')
          validar_get_id(ID_INEXISTENTE, 'NAO_ENCONTRADO')
          validar_get_id(ID_INVALIDO, 'ID_INVALIDO')
          "
      # 6. Faz o Request GET para testar
      # O curl -f faz o step falhar se o status code não for 2xx
      # O curl -v mostra os detalhes no log
      - name: Testar Endpoint (Get Autores)
        run: |
          curl -v -f http://localhost:5002/api/autores
